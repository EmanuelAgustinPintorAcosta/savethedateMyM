<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Save the Date</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,600;1,600&family=Great+Vibes&family=MonteCarlo&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --green-dark: #526851;
        --green-light: #7c9d78;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        font-family: 'EB Garamond', serif;
        color: var(--green-dark);
        background: #f0ece6 url('assets/fondo.png') center top / min(100vw, 760px) auto repeat-y;
        overflow-x: hidden;
      }

      .page {
        width: min(100vw, 760px);
        margin: 0 auto;
        padding: clamp(16px, 4vw, 28px) clamp(14px, 4vw, 30px) clamp(28px, 7vw, 54px);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: clamp(10px, 2.8vw, 18px);
        text-align: center;
      }

      .reveal {
        opacity: 0;
        transform: translateY(16px);
        transition: opacity 700ms ease, transform 700ms ease;
      }

      .reveal.in {
        opacity: 1;
        transform: translateY(0);
      }

      .mono {
        margin: 0;
        font-size: clamp(1.05rem, 4.5vw, 1.8rem);
        letter-spacing: 0.1em;
        color: var(--green-light);
        font-weight: 600;
      }

      .title {
        margin: 0;
        font-size: clamp(2.2rem, 12vw, 5rem);
        line-height: 1;
        font-family: 'Great Vibes', cursive;
        font-weight: 400;
        color: var(--green-dark);
      }

      .silueta {
        width: clamp(180px, 50vw, 340px);
        max-width: 90%;
        height: auto;
        display: block;
      }

      .montecarlo-regular {
        font-family: 'MonteCarlo', cursive;
        font-weight: 400;
        font-style: normal;
      }

      .names {
        margin: 0;
        font-size: clamp(2.35rem, 11.2vw, 4.8rem);
        line-height: 1;
        white-space: nowrap;
        color: var(--green-light);
      }

      .date {
        margin: 0;
        font-size: clamp(2.05rem, 11vw, 4.2rem);
        letter-spacing: 0.11em;
        font-weight: 600;
        color: var(--green-dark);
      }

      .invite {
        margin: 0;
        font-size: clamp(1.12rem, 5.2vw, 2rem);
        font-style: italic;
        color: var(--green-dark);
        max-width: 90%;
      }

      .solo-faltan {
        margin: 0;
        font-size: clamp(1.5rem, 7vw, 2.6rem);
        letter-spacing: 0.08em;
        color: var(--green-light);
      }

      .counter-wrap {
        position: relative;
        width: min(95%, 510px);
        display: grid;
        place-items: center;
        margin-top: 0;
      }

      .humo {
        width: 120%;
        height: auto;
        opacity: 0.68;
        grid-area: 1 / 1;
        pointer-events: none;
      }

      .days {
        grid-area: 1 / 1;
        margin: 0;
        font-size: clamp(4rem, 20vw, 8rem);
        line-height: 0.9;
        font-weight: 600;
        color: var(--green-dark);
      }

      .dias-badge {
        margin-top: 0;
        background: color-mix(in srgb, var(--green-dark) 88%, #fff 12%);
        color: #fff;
        border-radius: 8px;
        padding: clamp(8px, 2vw, 12px) clamp(34px, 9vw, 60px);
        font-size: clamp(1.65rem, 8vw, 2.8rem);
        font-style: italic;
        line-height: 1;
      }

      .soon {
        margin-top: clamp(20px, 5vw, 34px);
        width: min(92%, 540px);
        background: color-mix(in srgb, var(--green-dark) 88%, #fff 12%);
        color: #fff;
        border-radius: 8px;
        padding: clamp(14px, 3vw, 20px) clamp(12px, 4vw, 20px);
        font-size: clamp(1.35rem, 6.2vw, 2.4rem);
        font-style: italic;
        line-height: 1.25;
      }
    </style>
  </head>
  <body>
    <main class="page" aria-label="Invitación Save the Date">
      <p class="mono reveal">M | M</p>
      <h1 class="title reveal">Save the Date</h1>

      <img src="assets/siluetasinfondo.png" alt="Silueta de la pareja" class="silueta reveal" />

      <p class="names montecarlo-regular reveal">Maxi &amp; Melani</p>

      <p class="date reveal">31 | 10 | 26</p>
      <p class="invite reveal">¡Nos encantaría tenerte con nosotros!</p>

      <p class="solo-faltan reveal">SOLO FALTAN</p>

      <div class="counter-wrap reveal" aria-live="polite">
        <img src="assets/humo.png" alt="" class="humo" aria-hidden="true" />
        <p class="days" id="daysCounter">0</p>
      </div>

      <p class="dias-badge reveal">DÍAS</p>

      <p class="soon reveal">Próximamente recibirás<br />todos los detalles...</p>
    </main>

    <script>
      (function () {
        const counter = document.getElementById('daysCounter');
        const targetDate = new Date(2026, 9, 31);
        const DAY_MS = 1000 * 60 * 60 * 24;

        function startOfDay(d) {
          return new Date(d.getFullYear(), d.getMonth(), d.getDate());
        }

        function updateCounter() {
          const now = new Date();
          const days = Math.max(0, Math.round((startOfDay(targetDate) - startOfDay(now)) / DAY_MS));
          counter.textContent = String(days);
        }

        updateCounter();
        setInterval(updateCounter, 60 * 60 * 1000);

        const items = document.querySelectorAll('.reveal');
        const obs = new IntersectionObserver(
          function (entries) {
            entries.forEach(function (entry) {
              if (entry.isIntersecting) {
                entry.target.classList.add('in');
              }
            });
          },
          { threshold: 0.16 }
        );

        items.forEach(function (el, i) {
          el.style.transitionDelay = i * 60 + 'ms';
          obs.observe(el);
        });
      })();
    </script>
  </body>
</html>
